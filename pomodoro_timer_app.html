<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - ポモドーロタイマー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            work: '#ef4444',
                            break: '#10b981',
                            longBreak: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        /* スムーズなプログレスリング用アニメーション */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.3s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 transition-colors duration-300">
    
    <!-- Header Controls -->
    <header class="max-w-xl w-full mx-auto flex justify-between items-center py-2">
        <div class="flex items-center space-x-2">
            <i data-lucide="timer" class="w-6 h-6 text-red-500"></i>
            <h1 class="font-bold text-xl tracking-wide">Focus Flow</h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Theme Toggle -->
            <button id="themeToggleBtn" aria-label="テーマ切替" class="p-2.5 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
            <!-- Settings Modal Toggle -->
            <button id="settingsBtn" aria-label="設定" class="p-2.5 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-xl w-full mx-auto my-auto flex flex-col items-center">
        
        <!-- Mode Switcher Tabs -->
        <div class="flex bg-slate-200 dark:bg-slate-800/80 p-1.5 rounded-2xl mb-8 w-full max-w-sm justify-between shadow-inner">
            <button id="presetStandardBtn" class="mode-tab flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">
                25分 / 5分
            </button>
            <button id="presetLongBtn" class="mode-tab flex-1 py-2 px-3 text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                50分 / 10分
            </button>
            <button id="presetCustomBtn" class="mode-tab flex-1 py-2 px-3 text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                カスタム
            </button>
        </div>

        <!-- Task Input Field -->
        <div class="w-full max-w-sm mb-6">
            <div class="relative flex items-center">
                <i data-lucide="edit-3" class="w-4 h-4 absolute left-3.5 text-slate-400"></i>
                <input type="text" id="taskInput" placeholder="取り組むタスクを入力... (任意)" 
                       class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/50 shadow-sm transition">
            </div>
        </div>

        <!-- Timer Display Area -->
        <div class="relative flex items-center justify-center my-2">
            <!-- Circular Progress SVG -->
            <svg class="w-64 h-64 sm:w-80 sm:h-80" viewBox="0 0 240 240">
                <!-- Background Circle -->
                <circle class="text-slate-200 dark:text-slate-800" stroke-width="8" stroke="currentColor" fill="transparent" r="100" cx="120" cy="120" />
                <!-- Progress Circle -->
                <circle id="progressCircle" class="progress-ring-circle text-red-500" stroke-width="8" stroke-dasharray="628.318" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="100" cx="120" cy="120" />
            </svg>

            <!-- Time Text Inside Circle -->
            <div class="absolute flex flex-col items-center justify-center text-center">
                <span id="sessionStatus" class="text-xs uppercase tracking-widest font-bold text-red-500 mb-1">作業中</span>
                <span id="timerText" class="text-5xl sm:text-6xl font-extrabold tracking-tight font-mono">25:00</span>
                <span id="nextSessionHint" class="text-xs text-slate-400 mt-2">次は: 5分 休憩</span>
            </div>
        </div>

        <!-- Timer Action Buttons -->
        <div class="flex items-center space-x-4 mt-8">
            <!-- Reset Button -->
            <button id="resetBtn" title="リセット" class="p-3.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition active:scale-95 shadow-sm">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
            </button>

            <!-- Main Start/Pause Button -->
            <button id="startPauseBtn" class="px-8 py-3.5 rounded-full bg-red-500 hover:bg-red-600 text-white font-semibold text-lg flex items-center space-x-2 shadow-lg shadow-red-500/30 transition transform active:scale-95">
                <i id="startPauseIcon" data-lucide="play" class="w-5 h-5 fill-current"></i>
                <span id="startPauseLabel">スタート</span>
            </button>

            <!-- Skip Button -->
            <button id="skipBtn" title="スキップ" class="p-3.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition active:scale-95 shadow-sm">
                <i data-lucide="skip-forward" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Daily Statistics Bar -->
        <div class="grid grid-cols-2 gap-4 w-full max-w-sm mt-10">
            <div class="bg-white dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/60 rounded-2xl p-4 text-center shadow-sm">
                <div class="text-xs text-slate-400 font-medium mb-1 flex items-center justify-center space-x-1">
                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-500"></i>
                    <span>完了ポモドーロ</span>
                </div>
                <div id="completedCount" class="text-2xl font-bold">0</div>
            </div>
            <div class="bg-white dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/60 rounded-2xl p-4 text-center shadow-sm">
                <div class="text-xs text-slate-400 font-medium mb-1 flex items-center justify-center space-x-1">
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-blue-500"></i>
                    <span>合計集中時間</span>
                </div>
                <div id="totalFocusTime" class="text-2xl font-bold">0分</div>
            </div>
        </div>

    </main>

    <!-- Custom Settings Modal (Hidden by default) -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 transition-all">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold flex items-center space-x-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-red-500"></i>
                    <span>カスタム時間設定</span>
                </h2>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="customSettingsForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">作業時間 (分)</label>
                    <input type="number" id="customWorkInput" min="1" max="120" value="30" class="w-full px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">小休憩 (分)</label>
                    <input type="number" id="customBreakInput" min="1" max="60" value="5" class="w-full px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">長休憩 (分)</label>
                    <input type="number" id="customLongBreakInput" min="1" max="60" value="15" class="w-full px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-red-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl transition shadow-md mt-2">
                    設定を保存して適用
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-2">
        Focus Flow &copy; Pomodoro Timer
    </footer>

    <script>
        // --- State Variables ---
        let timerState = {
            mode: 'standard', // 'standard', 'long', 'custom'
            sessionType: 'work', // 'work', 'break', 'longBreak'
            workDuration: 25 * 60,
            breakDuration: 5 * 60,
            longBreakDuration: 15 * 60,
            customWorkDuration: 30 * 60,
            customBreakDuration: 5 * 60,
            customLongBreakDuration: 15 * 60,
            timeLeft: 25 * 60,
            totalTime: 25 * 60,
            isRunning: false,
            completedSessions: 0,
            totalFocusMinutes: 0,
            cycleCount: 0 // 4回の作業で長休憩に入れるためのカウント
        };

        let timerInterval = null;
        const CIRCUMFERENCE = 2 * Math.PI * 100; // Radius = 100

        // --- DOM Elements ---
        const timerText = document.getElementById('timerText');
        const sessionStatus = document.getElementById('sessionStatus');
        const nextSessionHint = document.getElementById('nextSessionHint');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseIcon = document.getElementById('startPauseIcon');
        const startPauseLabel = document.getElementById('startPauseLabel');
        const resetBtn = document.getElementById('resetBtn');
        const skipBtn = document.getElementById('skipBtn');
        const progressCircle = document.getElementById('progressCircle');
        const completedCountEl = document.getElementById('completedCount');
        const totalFocusTimeEl = document.getElementById('totalFocusTime');

        const presetStandardBtn = document.getElementById('presetStandardBtn');
        const presetLongBtn = document.getElementById('presetLongBtn');
        const presetCustomBtn = document.getElementById('presetCustomBtn');

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const customSettingsForm = document.getElementById('customSettingsForm');

        // --- Audio Notification (Web Audio API) ---
        function playChimeSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // 2音で構成される優しいチャイム音
                const playTone = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + duration);
                };

                const now = ctx.currentTime;
                playTone(523.25, now, 0.8);      // C5
                playTone(659.25, now + 0.2, 1.2); // E5
            } catch(e) {
                console.log('Audio playback prevented', e);
            }
        }

        // --- Core Functions ---
        function updateTimerDisplay() {
            const minutes = Math.floor(timerState.timeLeft / 60);
            const seconds = timerState.timeLeft % 60;
            const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            timerText.textContent = formattedTime;
            document.title = `(${formattedTime}) Focus Flow`;

            // Progress Circle updates
            const progress = timerState.timeLeft / timerState.totalTime;
            const offset = CIRCUMFERENCE * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;
        }

        function setSessionType(type) {
            timerState.sessionType = type;
            let currentWork, currentBreak, currentLongBreak;

            if (timerState.mode === 'standard') {
                currentWork = 25 * 60;
                currentBreak = 5 * 60;
                currentLongBreak = 15 * 60;
            } else if (timerState.mode === 'long') {
                currentWork = 50 * 60;
                currentBreak = 10 * 60;
                currentLongBreak = 20 * 60;
            } else { // Custom
                currentWork = timerState.customWorkDuration;
                currentBreak = timerState.customBreakDuration;
                currentLongBreak = timerState.customLongBreakDuration;
            }

            // Status label & Colors update
            progressCircle.classList.remove('text-red-500', 'text-emerald-500', 'text-blue-500');
            sessionStatus.classList.remove('text-red-500', 'text-emerald-500', 'text-blue-500');
            startPauseBtn.classList.remove('bg-red-500', 'hover:bg-red-600', 'shadow-red-500/30',
                                          'bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/30',
                                          'bg-blue-500', 'hover:bg-blue-600', 'shadow-blue-500/30');

            if (type === 'work') {
                timerState.totalTime = currentWork;
                sessionStatus.textContent = '作業中';
                nextSessionHint.textContent = `次は: ${Math.floor(currentBreak / 60)}分 休憩`;
                
                progressCircle.classList.add('text-red-500');
                sessionStatus.classList.add('text-red-500');
                startPauseBtn.classList.add('bg-red-500', 'hover:bg-red-600', 'shadow-red-500/30');
            } else if (type === 'break') {
                timerState.totalTime = currentBreak;
                sessionStatus.textContent = '小休憩';
                nextSessionHint.textContent = `次は: ${Math.floor(currentWork / 60)}分 作業`;

                progressCircle.classList.add('text-emerald-500');
                sessionStatus.classList.add('text-emerald-500');
                startPauseBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/30');
            } else if (type === 'longBreak') {
                timerState.totalTime = currentLongBreak;
                sessionStatus.textContent = '長休憩';
                nextSessionHint.textContent = `次は: ${Math.floor(currentWork / 60)}分 作業`;

                progressCircle.classList.add('text-blue-500');
                sessionStatus.classList.add('text-blue-500');
                startPauseBtn.classList.add('bg-blue-500', 'hover:bg-blue-600', 'shadow-blue-500/30');
            }

            timerState.timeLeft = timerState.totalTime;
            updateTimerDisplay();
        }

        function startTimer() {
            if (timerState.isRunning) return;
            timerState.isRunning = true;
            
            startPauseLabel.textContent = '一時停止';
            startPauseIcon.setAttribute('data-lucide', 'pause');
            lucide.createIcons();

            timerInterval = setInterval(() => {
                if (timerState.timeLeft > 0) {
                    timerState.timeLeft--;
                    updateTimerDisplay();
                } else {
                    handleTimerCompletion();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!timerState.isRunning) return;
            timerState.isRunning = false;
            clearInterval(timerInterval);

            startPauseLabel.textContent = '再開';
            startPauseIcon.setAttribute('data-lucide', 'play');
            lucide.createIcons();
        }

        function resetTimer() {
            pauseTimer();
            startPauseLabel.textContent = 'スタート';
            setSessionType(timerState.sessionType);
        }

        function handleTimerCompletion() {
            pauseTimer();
            playChimeSound();

            if (timerState.sessionType === 'work') {
                timerState.completedSessions++;
                timerState.cycleCount++;
                
                // Add focused time
                const focusMinutes = Math.floor(timerState.totalTime / 60);
                timerState.totalFocusMinutes += focusMinutes;
                
                completedCountEl.textContent = timerState.completedSessions;
                totalFocusTimeEl.textContent = `${timerState.totalFocusMinutes}分`;

                // 4回完了ごとに長休憩へ切り替え
                if (timerState.cycleCount >= 4) {
                    timerState.cycleCount = 0;
                    setSessionType('longBreak');
                } else {
                    setSessionType('break');
                }
            } else {
                setSessionType('work');
            }

            startTimer(); // 自動で次のセッションを開始
        }

        function skipSession() {
            pauseTimer();
            startPauseLabel.textContent = 'スタート';
            if (timerState.sessionType === 'work') {
                setSessionType('break');
            } else {
                setSessionType('work');
            }
        }

        // --- Preset Switcher UI logic ---
        function setActiveTab(button) {
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm', 'font-semibold');
                tab.classList.add('text-slate-600', 'dark:text-slate-400', 'font-medium');
            });
            button.classList.add('bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm', 'font-semibold');
            button.classList.remove('text-slate-600', 'dark:text-slate-400', 'font-medium');
        }

        // --- Event Listeners ---
        startPauseBtn.addEventListener('click', () => {
            if (timerState.isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', resetTimer);
        skipBtn.addEventListener('click', skipSession);

        presetStandardBtn.addEventListener('click', () => {
            setActiveTab(presetStandardBtn);
            timerState.mode = 'standard';
            resetTimer();
        });

        presetLongBtn.addEventListener('click', () => {
            setActiveTab(presetLongBtn);
            timerState.mode = 'long';
            resetTimer();
        });

        presetCustomBtn.addEventListener('click', () => {
            setActiveTab(presetCustomBtn);
            timerState.mode = 'custom';
            settingsModal.classList.remove('hidden'); // 開く
        });

        // Modal Controls
        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
        
        customSettingsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const workVal = parseInt(document.getElementById('customWorkInput').value) || 25;
            const breakVal = parseInt(document.getElementById('customBreakInput').value) || 5;
            const longBreakVal = parseInt(document.getElementById('customLongBreakInput').value) || 15;

            timerState.customWorkDuration = workVal * 60;
            timerState.customBreakDuration = breakVal * 60;
            timerState.customLongBreakDuration = longBreakVal * 60;

            timerState.mode = 'custom';
            setActiveTab(presetCustomBtn);
            settingsModal.classList.add('hidden');
            resetTimer();
        });

        // Theme Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setSessionType('work');
            
            // デフォルトでダークモードを好む場合の自動設定
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').setAttribute('data-lucide', 'sun');
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
